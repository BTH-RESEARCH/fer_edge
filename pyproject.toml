[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fer-edge"
version = "0.1.0"
description = "Nhận dạng biểu cảm khuôn mặt trên thiết bị biên: chạy ONNX, đo tốc độ trên Raspberry Pi 5"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

# Suy luận chỉ cần ONNX Runtime - KHÔNG cần PyTorch trên máy chạy.
dependencies = [
    "onnxruntime>=1.16",
    "numpy>=1.24",
    "pillow>=9.5",
    "opencv-python>=4.8",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "tabulate>=0.9",
    "tqdm>=4.65",
]

[project.optional-dependencies]
yolo = ["ultralytics>=8.3.0"]          # chỉ cần nếu muốn dùng YOLO-face thay YuNet (thường chỉ trên laptop)
dev = ["pytest>=7.4"]

[project.scripts]
fer-edge = "fer_edge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fer_edge = ["models.json"]
